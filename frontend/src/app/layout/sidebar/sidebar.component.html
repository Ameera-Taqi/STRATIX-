<aside class="flex h-full min-h-0 w-full flex-col border-e border-white/[0.06] bg-slate-950 text-slate-300">
  <div class="flex shrink-0 items-center gap-3 px-5 py-5">
    @if (logoUrl(); as logo) {
      <img [src]="logo" alt="" class="h-8 w-8 shrink-0 rounded-lg object-contain bg-white/10 p-0.5" />
    } @else {
      <svg viewBox="0 0 48 48" class="h-8 w-8 shrink-0" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="sxNav" x1="12" y1="36" x2="36" y2="12" gradientUnits="userSpaceOnUse">
            <stop stop-color="#1d4ed8" />
            <stop offset="1" stop-color="#60a5fa" />
          </linearGradient>
        </defs>
        <path d="M13 24 L24 15 L35 24" stroke="url(#sxNav)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M13 33 L24 24 L35 33" stroke="url(#sxNav)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
      </svg>
    }
    <div class="min-w-0 flex-1 leading-tight">
      <p class="truncate text-sm font-bold tracking-[0.18em] text-white">
        {{ orgName() || 'STRATIX' }}
      </p>
      <p class="truncate text-[8.5px] uppercase tracking-[0.2em] text-white/40">{{ 'app.tagline' | t }}</p>
    </div>
    <button
      type="button"
      class="rounded-lg p-1.5 text-slate-400 transition hover:bg-white/[0.06] hover:text-white lg:hidden"
      [attr.aria-label]="'nav.closeMenu' | t"
      (click)="closeNav()"
    >
      <app-ui-icon name="close" size="sm" />
    </button>
  </div>
  <nav class="min-h-0 flex-1 space-y-0.5 overflow-y-auto overscroll-contain px-3 py-2">
    @for (item of nav(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-primary/15 text-white ring-1 ring-inset ring-primary/25"
        [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-400 transition hover:bg-white/[0.04] hover:text-white"
        (click)="closeNav()"
      >
        <span class="flex w-5 shrink-0 items-center justify-center" [innerHTML]="item.icon"></span>
        <span class="min-w-0 truncate">{{ item.labelKey | t }}</span>
      </a>
    }
  </nav>
  <p class="shrink-0 border-t border-white/[0.06] p-4 text-center text-[10px] text-white/40">{{ 'app.platform' | t }}</p>
</aside>
