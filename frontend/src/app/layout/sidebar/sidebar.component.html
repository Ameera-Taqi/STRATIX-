<aside class="flex h-full w-64 shrink-0 flex-col border-r border-white/[0.06] bg-slate-950 text-slate-300">
  <div class="flex items-center gap-3 px-5 py-5">
    <svg viewBox="0 0 48 48" class="h-8 w-8 shrink-0" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="sxNav" x1="12" y1="36" x2="36" y2="12" gradientUnits="userSpaceOnUse">
          <stop stop-color="#1d4ed8" />
          <stop offset="1" stop-color="#60a5fa" />
        </linearGradient>
      </defs>
      <path d="M13 24 L24 15 L35 24" stroke="url(#sxNav)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M13 33 L24 24 L35 33" stroke="url(#sxNav)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
    </svg>
    <div class="min-w-0 leading-tight">
      <p class="text-sm font-bold tracking-[0.18em] text-white">STRATIX</p>
      <p class="text-[8.5px] uppercase tracking-[0.2em] text-white/40">{{ 'app.tagline' | t }}</p>
    </div>
  </div>
  <nav class="flex-1 space-y-0.5 px-3 py-2">
    @for (item of nav(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-primary/15 text-white ring-1 ring-inset ring-primary/25"
        [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-400 transition hover:bg-white/[0.04] hover:text-white"
      >
        <span class="flex w-5 shrink-0 items-center justify-center" [innerHTML]="item.icon"></span>
        {{ item.labelKey | t }}
      </a>
    }
  </nav>
  <p class="border-t border-white/[0.06] p-4 text-center text-[10px] text-white/40">{{ 'app.platform' | t }}</p>
</aside>
