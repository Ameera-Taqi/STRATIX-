<header class="stratix-topbar relative z-20 shrink-0">
  <div class="flex min-w-0 items-center gap-2">
    <button
      type="button"
      class="rounded-lg p-2 text-slate-500 transition hover:bg-surface dark:text-slate-400 dark:hover:bg-slate-800 lg:hidden"
      [attr.aria-label]="'nav.openMenu' | t"
      [attr.aria-expanded]="shellNav.open()"
      (click)="toggleNav($event)"
    >
      <app-ui-icon name="menu" size="md" />
    </button>
    <h1 class="truncate text-xl font-semibold text-dark dark:text-slate-100">{{ titleKey() | t }}</h1>
  </div>
  <div class="flex shrink-0 items-center gap-2 sm:gap-3">
    <div class="stratix-input hidden items-center gap-2 px-3 py-2 sm:flex">
      <app-ui-icon name="search" size="sm" className="text-slate-400" />
      <input
        type="search"
        [placeholder]="'common.search' | t"
        class="w-40 border-0 bg-transparent p-0 text-sm ring-0 focus:ring-0 lg:w-48"
        [(ngModel)]="searchTerm"
        (keydown.enter)="onSearch()"
      />
    </div>
    <app-theme-toggle />
    <app-lang-switcher />

    <button
      type="button"
      class="relative z-10 rounded-lg p-2 text-slate-500 transition hover:bg-surface dark:text-slate-400 dark:hover:bg-slate-800"
      [attr.aria-label]="'common.notifications' | t"
      [attr.aria-expanded]="panel.open()"
      (click)="onBellClick($event)"
    >
      <app-ui-icon name="bell" size="md" />
      @if (unreadCount() > 0) {
        <span
          class="absolute end-0.5 top-0.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-danger px-1 text-[10px] font-bold text-white"
        >
          {{ unreadCount() > 9 ? '9+' : unreadCount() }}
        </span>
      }
    </button>

    <div class="relative" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="flex items-center gap-2 rounded-lg border border-slate-200 px-3 py-1.5 transition hover:border-primary/30 hover:bg-primary/5 dark:border-slate-600 dark:hover:border-primary/40 dark:hover:bg-primary/10"
        [attr.aria-label]="'settings.profile' | t"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleUserMenu($event)"
      >
        <span class="flex h-8 w-8 items-center justify-center rounded-full bg-primary text-sm font-medium text-white">
          {{ initials() }}
        </span>
        <span class="hidden text-sm font-medium text-dark dark:text-slate-200 sm:inline">{{ profile().name }}</span>
        <span class="text-slate-400 transition" [class.rotate-180]="menuOpen()">
          <app-ui-icon name="chevron-down" size="xs" />
        </span>
      </button>

      @if (menuOpen()) {
        <div
          class="absolute end-0 top-[calc(100%+0.5rem)] z-30 w-56 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-lg dark:border-slate-600 dark:bg-slate-800"
          role="menu"
        >
          <div class="border-b border-slate-100 px-4 py-3 dark:border-slate-700">
            <p class="truncate text-sm font-semibold text-dark dark:text-slate-100">{{ profile().name }}</p>
            <p class="truncate text-xs text-slate-500 dark:text-slate-400">{{ roleKey(profile().roleCode) | t }}</p>
            <p class="truncate text-xs text-slate-400">{{ profile().email }}</p>
          </div>

          <div class="py-1">
            <button
              type="button"
              class="flex w-full items-center gap-3 px-4 py-2.5 text-sm text-slate-700 transition hover:bg-slate-50 dark:text-slate-200 dark:hover:bg-slate-700/60"
              role="menuitem"
              (click)="navigateAndClose('/settings')"
            >
              <app-ui-icon name="user" size="sm" />
              {{ 'userMenu.profile' | t }}
            </button>
            <button
              type="button"
              class="flex w-full items-center gap-3 px-4 py-2.5 text-sm text-slate-700 transition hover:bg-slate-50 dark:text-slate-200 dark:hover:bg-slate-700/60"
              role="menuitem"
              (click)="navigateAndClose(['/team', profile().employeeId])"
            >
              <app-ui-icon name="id-card" size="sm" />
              {{ 'userMenu.teamProfile' | t }}
            </button>
            <button
              type="button"
              class="flex w-full items-center gap-3 px-4 py-2.5 text-sm text-slate-700 transition hover:bg-slate-50 dark:text-slate-200 dark:hover:bg-slate-700/60"
              role="menuitem"
              (click)="navigateAndClose('/notifications')"
            >
              <app-ui-icon name="bell" size="sm" />
              {{ 'userMenu.notifications' | t }}
            </button>
            <button
              type="button"
              class="flex w-full items-center gap-3 px-4 py-2.5 text-sm text-slate-700 transition hover:bg-slate-50 dark:text-slate-200 dark:hover:bg-slate-700/60"
              role="menuitem"
              (click)="navigateAndClose('/settings')"
            >
              <app-ui-icon name="settings" size="sm" />
              {{ 'userMenu.settings' | t }}
            </button>
          </div>

          <div class="border-t border-slate-100 py-1 dark:border-slate-700">
            <button
              type="button"
              class="flex w-full items-center gap-3 px-4 py-2.5 text-sm text-danger transition hover:bg-red-50 dark:hover:bg-red-900/20"
              role="menuitem"
              (click)="logout()"
            >
              <app-ui-icon name="logout" size="sm" />
              {{ 'module.signOut' | t }}
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</header>
