<div class="stratix-shell">
  @if (shellNav.open()) {
    <button
      type="button"
      class="stratix-nav-backdrop"
      [attr.aria-label]="'nav.closeMenu' | t"
      (click)="shellNav.close()"
    ></button>
  }

  <app-sidebar class="stratix-sidebar-drawer" [attr.data-open]="shellNav.open() ? 'true' : 'false'" />

  <main id="main-content" class="dashboard-content flex min-h-0 min-w-0 flex-1 flex-col" tabindex="-1">
    <router-outlet />
  </main>
</div>
